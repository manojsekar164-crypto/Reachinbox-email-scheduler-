name: ReachInbox Cloud Email Worker

# NOTE: GitHub Actions scheduled triggers ('schedule') require this workflow file
# to be present on the repository's default branch (e.g. 'main').
# Manual triggers ('workflow_dispatch') function on any branch.
on:
  schedule:
    # Runs every 5 minutes on GitHub Actions shared runners
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      max_duration_seconds:
        description: 'Maximum worker run duration in seconds (must be < 300)'
        required: false
        default: '240'
      idle_timeout_seconds:
        description: 'Idle timeout in seconds before worker exits on empty queue'
        required: false
        default: '15'

# Least-privilege permissions: only read repository code
permissions:
  contents: read

# Concurrency group ensures two workflow runs cannot execute concurrently
concurrency:
  group: email-worker
  cancel-in-progress: false

jobs:
  run-bounded-worker:
    name: Process Due BullMQ Email Deliveries
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build TypeScript backend
        run: |
          cd backend
          npm run build

      - name: Execute Bounded Cloud Email Worker
        env:
          NODE_ENV: production
          # Core secrets strictly required by the email worker runtime
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # Bounded worker operational limits
          WORKER_MAX_DURATION_SECONDS: ${{ github.event.inputs.max_duration_seconds || '240' }}
          WORKER_IDLE_TIMEOUT_SECONDS: ${{ github.event.inputs.idle_timeout_seconds || '15' }}
          WORKER_CONCURRENCY: '2'
          ENABLE_INLINE_WORKER: 'false'
          START_WORKER: 'false'
        run: |
          cd backend
          node dist/workers/boundedWorker.js
